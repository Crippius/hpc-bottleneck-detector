[project]
name = "hpc-bottleneck-detector"
version = "0.1.0"
description = "Automated HPC job bottleneck detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3,<3",
    "numpy>=2.2,<3",
    "PyYAML>=6.0,<7",
    "requests[socks]>=2.32,<3",
    "urllib3>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "joblib>=1.5,<2",
    "scikit-learn>=1.7,<2",
    "xgboost>=3.0,<4",
    "tsfresh>=0.21,<0.22",
    "stumpy>=1.13,<2",
    "numba>=0.60,<1",
]

[project.scripts]
bottleneck-detect = "hpc_bottleneck_detector.cli:main"

[project.optional-dependencies]
dev = [
    "matplotlib",
    "ipykernel",
    "dvc",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_bottleneck_detector"]
