# =============================================================================
# xbat CLI configuration - SUPERVISED ML (XGBoost)
# =============================================================================
#
# Run:  uv run bottleneck-detect --job-id <JOB_ID> --config configs/xbat_cli_xgboost.yaml
#
# Train the model first:  python scripts/training/train_ml_model.py --classifier xgboost

hardware:
  profiles_dir: configs/hardware_profiles

pipeline:
  window_size: 12
  step_size: 12

# ---------------------------------------------------------------------------
# Data source - XBAT REST API
# ---------------------------------------------------------------------------
# Credentials are read from the .env file (copy .env.example -> .env).
data_source:
  type: xbat
  env_file: .env
  group: ""
  metric: ""
  level: job
  token_file: .env.xbat

# ---------------------------------------------------------------------------
# Strategy: SUPERVISED ML (XGBoost)
# ---------------------------------------------------------------------------
strategy:
  type: supervised_ml
  model_path: models/xgboost.pkl
  significance_threshold: 0.3

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  format: json
  show_healthy_windows: false # only show windows with detected bottlenecks
  min_severity: 0.3
  min_confidence: 0.3
