# =============================================================================
# xbat CLI configuration
# =============================================================================
#
# Run:  uv run bottleneck-detect --job-id <JOB_ID>
#
# Switch strategy by uncommenting the relevant block below.

pipeline:
  window_size: 12
  step_size: 12

# ---------------------------------------------------------------------------
# Data source - XBAT REST API
# ---------------------------------------------------------------------------
# Credentials are read from the .env file (copy .env.example -> .env).
data_source:
  type: xbat
  env_file: .env
  group: ""
  metric: ""
  level: job
  token_file: .env.xbat

# ---------------------------------------------------------------------------
# Strategy: HEURISTIC
# ---------------------------------------------------------------------------
strategy:
  type: heuristic
  strategy_folder: configs/strategies/persyst_strategy

# ---------------------------------------------------------------------------
# Strategy: SUPERVISED ML (requires a trained model)
# ---------------------------------------------------------------------------
# --- Random Forest ---
# strategy:
#   type: supervised_ml
#   model_path: models/rf.pkl
#   significance_threshold: 0.3

# --- XGBoost ---
# strategy:
#   type: supervised_ml
#   model_path: models/xgboost.pkl
#   significance_threshold: 0.3

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  format: json
  show_healthy_windows: false # only show windows with detected bottlenecks
  min_severity: 0.3
  min_confidence: 0.3
